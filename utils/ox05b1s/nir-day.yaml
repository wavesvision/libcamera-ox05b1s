#
# OX05B1S daylight NIR processing. The infrared component is subtracted from
# the red, green and blue channels. Runs at 60 fps nominal, falling back to
# approximately 15 fps in low light.

properties:
  - loop: 60

frames:
  - 0:
      NirMode: 1
      NirRed: 7
      NirGreen: 4
      NirBlue: 3
      FrameDurationLimits: [16666, 66666]
