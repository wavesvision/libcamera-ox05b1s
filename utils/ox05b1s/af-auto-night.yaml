#
# Continuous autofocus with the DW9714 VCM and the night NIR profile.
# Runs at 60 fps nominal, falling back to approximately 15 fps in low light.

properties:
  - loop: 60

frames:
  - 0:
      AfMode: 2
      AfRange: 0
      AfSpeed: 0
      NirMode: 2
      NirRed: 6
      NirGreen: 3
      NirBlue: 0
      FrameDurationLimits: [16666, 66666]
